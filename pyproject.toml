[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathsolver-help"
version = "0.1.0"
description = "BYOK AI math solver with independent verification — bring your own OpenAI-compatible API key, answers verified by local expression evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["math", "solver", "ai", "byok", "verification", "step-by-step", "education"]
authors = [{ name = "mathsolver.help" }]

[project.urls]
Homepage = "https://mathsolver.help"
Repository = "https://github.com/mathsolver-help/mathsolver-python"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
